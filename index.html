<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dina Advani</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* Container wrapper overrides iOS Safari's native iframe auto-resizing */
    #wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
    }

    iframe {
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <iframe src="https://sportmaster413.wixsite.com/empoweredlearning" title="Dina Advani - Empowered Learning"></iframe>
  </div>
</body>
</html>
